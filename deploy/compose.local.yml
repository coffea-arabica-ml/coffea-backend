# Só para a validação no Docker Desktop (Windows), por cima do docker-compose.yml:
#   docker compose -f docker-compose.yml -f compose.local.yml <comando>
# Portas só no 127.0.0.1 (o Caddy atende "localhost" com um certificado da CA interna dele) e a API
# presa a 1 CPU, como o VPS. Roteiro em DEPLOY.md, "Validação local".
services:
  api:
    cpuset: "0"
    environment:
      # No VPS (1 vCPU), o coffea-ml já calcula 1 thread; aqui a máquina tem mais CPUs.
      OMP_NUM_THREADS: "1"
  caddy:
    ports: !override
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"
